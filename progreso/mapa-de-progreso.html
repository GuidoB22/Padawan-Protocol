<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del Padawan</title>
<style id="css">
:root{
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --bg:#f1f5f9;--panel:#ffffff;--grid:#cbd5e1;--ink:#0f172a;--muted:#64748b;--dim:#94a3b8;--border:#e2e8f0;
  --edge:#94a3b8;--band:rgba(148,163,184,.06);
  --frontend-s:#0891b2;--frontend-f:#cffafe;
  --backend-s:#059669;--backend-f:#d1fae5;
  --database-s:#7c3aed;--database-f:#ede9fe;
  --cloud-s:#d97706;--cloud-f:#fef3c7;
  --security-s:#e11d48;--security-f:#ffe4e6;
  --bus-s:#ea580c;--bus-f:#ffedd5;
  --external-s:#64748b;--external-f:#e2e8f0;
}
:root[data-theme="dark"]{
  --bg:#020617;--panel:#0b1222;--grid:#1e293b;--ink:#f8fafc;--muted:#94a3b8;--dim:#64748b;--border:#1e293b;
  --edge:#64748b;--band:rgba(148,163,184,.04);
  --frontend-s:#22d3ee;--frontend-f:rgba(34,211,238,.13);
  --backend-s:#34d399;--backend-f:rgba(52,211,153,.13);
  --database-s:#a78bfa;--database-f:rgba(167,139,250,.14);
  --cloud-s:#fbbf24;--cloud-f:rgba(251,191,36,.12);
  --security-s:#fb7185;--security-f:rgba(251,113,133,.13);
  --bus-s:#fb923c;--bus-f:rgba(251,146,60,.13);
  --external-s:#94a3b8;--external-f:rgba(148,163,184,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#020617;--panel:#0b1222;--ink:#f8fafc}}
.t-frontend{--s:var(--frontend-s);--f:var(--frontend-f)} .t-backend{--s:var(--backend-s);--f:var(--backend-f)}
.t-database{--s:var(--database-s);--f:var(--database-f)} .t-cloud{--s:var(--cloud-s);--f:var(--cloud-f)}
.t-security{--s:var(--security-s);--f:var(--security-f)} .t-bus{--s:var(--bus-s);--f:var(--bus-f)}
.t-external{--s:var(--external-s);--f:var(--external-f)}
.e-default{--es:var(--edge)} .e-main{--es:var(--backend-s)} .e-async{--es:var(--database-s)}
.e-security{--es:var(--security-s)} .e-return{--es:var(--dim)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{padding:24px 16px 48px}
.wrap{max-width:1600px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 4px 18px}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--frontend-s);box-shadow:0 0 0 3px var(--frontend-f)}
.subtitle{margin:4px 0 0 19px;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
button{font:500 12px var(--mono);color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;transition:border-color .15s}
button:hover{border-color:var(--frontend-s)}
button:focus-visible{outline:2px solid var(--frontend-s);outline-offset:2px}
#warn{font:600 11px var(--mono);color:var(--security-s);border:1px solid var(--security-s);border-radius:99px;padding:4px 10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;overflow-x:auto}
#d{display:block;margin:0 auto;max-width:100%;height:auto}
#legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 8px 2px;font:500 11px var(--mono);color:var(--muted)}
#legend b{font:700 12px var(--sans);color:var(--ink);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:11px;border-radius:3px;border:1.5px solid var(--s);background:var(--f)}
.cnt{font-size:10px;border:1px solid var(--border);border-radius:99px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s)}
.card ul{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px;line-height:1.7}
.card li::marker{color:var(--s)}

/* svg */
.bg{fill:var(--panel)} .dots circle{fill:var(--grid)}
.box{fill:var(--f);stroke:var(--s);stroke-width:1.5}
.inner{fill:none;stroke-width:1}
.icon{fill:none;stroke:var(--s);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.nl{font:700 12.5px var(--mono);fill:var(--ink)}
.ns{font:400 10px var(--mono);fill:var(--muted)}
.line{fill:none;stroke:var(--es);stroke-width:1.5}
.e-main .line{stroke-width:2.2}
.e-async .line,.e-security .line{stroke-dasharray:6 4}
.e-return .line{stroke-dasharray:4 4}
.arrow{fill:var(--es)}
.lab text,.mtext{font:500 10px var(--mono);fill:var(--es);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.mtext{font-size:10.5px}
.bound{fill:var(--f);fill-opacity:.35;stroke:var(--s);stroke-width:1.3;stroke-dasharray:6 4}
.bl{font:600 10.5px var(--mono);fill:var(--s);paint-order:stroke;stroke:var(--panel);stroke-width:6px;stroke-linejoin:round}
.band{fill:var(--band);stroke:var(--border);stroke-width:1.2;stroke-dasharray:5 4}
.band.exception{stroke:var(--security-s);stroke-opacity:.45}
.bandl{font:600 10px var(--mono);fill:var(--dim);letter-spacing:.04em}
.life{stroke:var(--dim);stroke-dasharray:3 5;stroke-width:1}
.bar{fill:var(--f);stroke:var(--s);stroke-width:1.2}
.start{fill:var(--backend-s)} .startl{stroke:var(--backend-s);stroke-width:2}
.tbl-body{fill:var(--panel)} .tbl-sep{stroke:var(--s);stroke-width:1;stroke-opacity:.45}
.tn{font:700 12.5px var(--mono);fill:var(--ink)}
.cn{font:500 11px var(--mono);fill:var(--ink)} .cn.nul{fill:var(--muted)}
.ct{font:400 10px var(--mono);fill:var(--muted)}
.key{font:700 8.5px var(--mono);fill:var(--s);letter-spacing:.04em} .key.pk{fill:var(--cloud-s)}
.erm{fill:none;stroke:var(--es);stroke-width:1.5} .erm-o{fill:var(--panel);stroke:var(--es);stroke-width:1.5}
.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke}
g.node text,.icon,.lab text{pointer-events:none}
.rowbg{fill:transparent} .rowbg.hot{fill:var(--f)}
.e-hot{--es:var(--frontend-s)}
svg.focus g.edge.hot .line{stroke:var(--frontend-s);stroke-width:2.4}
svg.focus g.lab.hot text,svg.focus g.edge.hot .mtext{fill:var(--frontend-s)}
svg.zoomed{cursor:grab} svg.zoomed:active{cursor:grabbing}
.panel{position:relative}
.clean .tools,.clean .zoom{display:none}
.zoom{position:absolute;top:12px;right:12px;display:flex;gap:4px;z-index:1}
.zoom button{padding:4px 9px;font-size:11px;min-width:30px}
.panel:fullscreen{overflow:auto;display:flex;flex-direction:column;justify-content:center;border-radius:0}
.panel:fullscreen #d{max-height:88vh;width:auto}
g.node,g.edge,g.lab{transition:opacity .16s}
svg.focus g.node:not(.hot),svg.focus g.edge:not(.hot),svg.focus g.lab:not(.hot){opacity:.18}
@media (prefers-reduced-motion:reduce){g.node,g.edge,g.lab{transition:none}}
</style>
<style id="padawan-extra">
/* Padawan: capa visual sobre la plantilla (estrellas, brillo de holograma, estados, puntitos). */
:root[data-theme="dark"]{background:#02030a}
:root[data-theme="dark"] body{
  min-height:100vh;
  background:#02030a;
  background-image:
    radial-gradient(ellipse at 15% -5%, rgba(40,80,190,.30), transparent 55%),
    radial-gradient(ellipse at 95% 105%, rgba(130,50,160,.20), transparent 50%);
  background-attachment:fixed;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#stars i{position:absolute;width:1px;height:1px;border-radius:50%;background:#cfe0ff;box-shadow:0 0 3px 1px rgba(160,190,255,.55);animation:pdw-twinkle 4s ease-in-out infinite}
:root[data-theme="light"] #stars{display:none}
.wrap,.panel,.cards,header{position:relative;z-index:1}

:root[data-theme="dark"] .panel{
  border-color:rgba(90,160,255,.35);
  box-shadow:0 0 38px rgba(60,120,255,.14), inset 0 0 40px rgba(60,120,255,.05);
}
:root[data-theme="dark"] .panel::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(120,170,255,.035) 0 1px, transparent 1px 4px);
}
:root[data-theme="dark"] .card{border-color:rgba(90,160,255,.22);background:rgba(8,14,32,.82)}
#rankbar{margin:10px 0 0;height:6px;max-width:420px;border-radius:99px;background:rgba(120,160,255,.15);overflow:hidden}
#rankbar>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#7dd3fc);box-shadow:0 0 10px rgba(52,211,153,.6)}

/* Estados de las cajas */
g.node.s-listo{filter:drop-shadow(0 0 6px rgba(52,211,153,.5))}
g.node.s-curso{animation:pdw-pulse 2.2s ease-in-out infinite}
g.node.s-pend{opacity:.82}
g.edge.s-pend{opacity:.4}
g.edge.s-pend .line{stroke-dasharray:3 6}
.dot{pointer-events:none;fill:#e8fff6;filter:drop-shadow(0 0 4px #34d399)}
.dot.dot-curso{fill:#fff7d6;filter:drop-shadow(0 0 4px #fbbf24)}

@keyframes pdw-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pdw-pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(251,191,36,.35))}50%{filter:drop-shadow(0 0 11px rgba(251,191,36,.95))}}
@media (prefers-reduced-motion:reduce){
  #stars i,g.node.s-curso{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><p class="subtitle" id="subtitle" hidden></p></div>
    <div class="tools">
      <span id="warn" hidden></span>
      <button id="theme" type="button" aria-label="Toggle theme">◐ theme</button>
      <button id="svgbtn" type="button">SVG</button>
      <button id="pngbtn" type="button">PNG</button>
    </div>
  </header>
  <div class="panel">
    <div class="zoom" title="Ctrl + wheel zooms, drag pans, double click resets">
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <button type="button" data-z="fit" id="zpct" aria-label="Reset zoom">100%</button>
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" data-z="full" aria-label="Fullscreen">⛶</button>
    </div>
    <svg id="d" xmlns="http://www.w3.org/2000/svg" role="img"></svg>
    <div id="legend"></div>
  </div>
  <section class="cards" id="notes"></section>
</div>
<pre id="diagram-report" hidden></pre>

<!--
  ESTADO DEL MAPA: cada caja tiene un `type` en el JSON de abajo (script id="spec").
    bus     = pendiente (naranja)
    cloud   = en curso (amarillo)
    backend = habilitado (verde)
  Para actualizar el avance, cambiá solo el `type` de las cajas. Nada más.
  Base: plantilla del skill diagram (adaptada de archify, MIT). Ver LICENCIA-archify.md.
-->
<script type="application/json" id="spec">
{
  "type": "workflow",
  "title": "Mapa del Padawan",
  "subtitle": "Que la Fuerza te acompañe",
  "theme": "dark",
  "rows": [
    {"label": "Tu camino"},
    {"label": "Lo que ya podés usar"}
  ],
  "nodes": [
    {"id": "n0", "label": "Nivel 00", "sub": "Contexto", "type": "cloud", "row": 0, "col": 0, "start": true},
    {"id": "n1", "label": "Nivel 01", "sub": "Fundamentos", "type": "bus", "row": 0, "col": 1},
    {"id": "n2", "label": "Nivel 02", "sub": "Memoria", "type": "bus", "row": 0, "col": 2},
    {"id": "n3", "label": "Nivel 03", "sub": "Segundo cerebro", "type": "bus", "row": 0, "col": 3},
    {"id": "n4", "label": "Nivel 04", "sub": "Vocabulario", "type": "bus", "row": 0, "col": 4},
    {"id": "n5", "label": "Nivel 05", "sub": "Persona propia", "type": "bus", "row": 0, "col": 5},
    {"id": "n6", "label": "Nivel 06", "sub": "Avanzado", "type": "bus", "row": 0, "col": 6, "end": true},
    {"id": "t0", "label": "quien-soy.md", "sub": "tu contexto", "type": "cloud", "row": 1, "col": 0},
    {"id": "t2", "label": "memoria.md", "sub": "recuerda tus sesiones", "type": "bus", "row": 1, "col": 2},
    {"id": "t3", "label": "Vault + MCP", "sub": "notas conectadas", "type": "bus", "row": 1, "col": 3},
    {"id": "t5", "label": "CLAUDE.md", "sub": "tu forma de trabajo", "type": "bus", "row": 1, "col": 5},
    {"id": "t6", "label": "Skills y rutinas", "sub": "tareas repetibles", "type": "bus", "row": 1, "col": 6}
  ],
  "edges": [
    {"from": "n0", "to": "n1", "style": "main"},
    {"from": "n1", "to": "n2", "style": "main"},
    {"from": "n2", "to": "n3", "style": "main"},
    {"from": "n3", "to": "n4", "style": "main"},
    {"from": "n4", "to": "n5", "style": "main"},
    {"from": "n5", "to": "n6", "style": "main"},
    {"from": "n0", "to": "t0", "style": "default"},
    {"from": "n2", "to": "t2", "style": "default"},
    {"from": "n3", "to": "t3", "style": "default"},
    {"from": "n5", "to": "t5", "style": "default"},
    {"from": "n6", "to": "t6", "style": "default"}
  ],
  "legend": {"backend": "Habilitado", "cloud": "En curso", "bus": "Pendiente"},
  "edge_legend": {"main": "Tu camino", "default": "Lo que habilita"},
  "notes": [{"title": "Tu progreso", "type": "backend", "items": ["Se completa solo al abrir el mapa"]}]
}
</script>

<script>
const NS = 'http://www.w3.org/2000/svg';
const spec = JSON.parse(document.getElementById('spec').textContent);
const svg = document.getElementById('d');
const issues = [];
const stats = {};   // informative, not failures: e.g. how many line crossings were left after routing

const TYPES = ['frontend', 'backend', 'database', 'cloud', 'security', 'bus', 'external'];
const ALIAS = {active: 'frontend', client: 'frontend', ui: 'frontend', service: 'backend', success: 'backend',
  done: 'backend', start: 'backend', db: 'database', storage: 'database', decision: 'database', data: 'database',
  waiting: 'cloud', infra: 'cloud', failure: 'security', error: 'security', policy: 'security',
  messagebus: 'bus', queue: 'bus', event: 'bus', stream: 'bus', user: 'external', person: 'external', neutral: 'external'};
const TYPE_NAMES = {frontend: 'Frontend', backend: 'Backend', database: 'Data store', cloud: 'Cloud / infra',
  security: 'Security / policy', bus: 'Messaging', external: 'External'};
const EDGE_NAMES = {main: 'main path', default: 'call', async: 'async', security: 'security / policy', return: 'return'};
const typeOf = t => { t = ALIAS[t] || t; return TYPES.includes(t) ? t : 'external'; };
const styleOf = s => EDGE_NAMES[s] ? s : 'default';

// Icons: 12x12 stroke glyphs, one per semantic type.
const ICON = {
  frontend: 'M1 2h10v8H1z M1 4.5h10',
  backend: 'M4 3L1 6l3 3 M8 3l3 3-3 3',
  database: 'M2 2.5c0-1.5 8-1.5 8 0v7c0 1.5-8 1.5-8 0z M2 2.5c0 1.5 8 1.5 8 0',
  cloud: 'M3.5 9.5h5.5a2.2 2.2 0 0 0 .3-4.4A3 3 0 0 0 3.6 4.6 2.5 2.5 0 0 0 3.5 9.5z',
  security: 'M6 1l4.5 1.8v3.2c0 2.6-2 4.3-4.5 5-2.5-.7-4.5-2.4-4.5-5V2.8z',
  bus: 'M1.5 3h9 M1.5 6h9 M1.5 9h9',
  external: 'M5 2H2v8h8V7 M7 1.5h3.5V5 M10.5 1.5L6 6',
  // Extra glyphs, picked with "icon" on a node (or implied by lifecycle-style types).
  user: 'M6 6a2.2 2.2 0 1 0 0-4.4A2.2 2.2 0 0 0 6 6z M1.5 11c.6-2.4 2.3-3.6 4.5-3.6s3.9 1.2 4.5 3.6',
  doc: 'M2.5 1h5l2.5 2.5V11h-7.5z M7.5 1v2.5H10 M4.5 6h3.5 M4.5 8.5h3.5',
  money: 'M1 3h10v6H1z M6 7.4a1.4 1.4 0 1 0 0-2.8 1.4 1.4 0 0 0 0 2.8z',
  clock: 'M6 11a5 5 0 1 0 0-10 5 5 0 0 0 0 10z M6 3.5V6l1.8 1.2',
  check: 'M6 11a5 5 0 1 0 0-10 5 5 0 0 0 0 10z M3.8 6.1l1.5 1.5 2.9-3',
  x: 'M6 11a5 5 0 1 0 0-10 5 5 0 0 0 0 10z M4.2 4.2l3.6 3.6 M7.8 4.2L4.2 7.8',
  alert: 'M6 1.2l5 9.3H1z M6 4.6v2.6 M6 8.8v.1',
  diamond: 'M6 1l5 5-5 5-5-5z',
  pulse: 'M1 6h2.3l1.4-3.2 2.2 6.4L8.4 6H11',
  gear: 'M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M6 .8v1.6 M6 9.6v1.6 M.8 6h1.6 M9.6 6h1.6 M2.3 2.3l1.1 1.1 M8.6 8.6l1.1 1.1 M2.3 9.7l1.1-1.1 M8.6 3.4l1.1-1.1',
  mail: 'M1 2.5h10v7H1z M1 3l5 3.6L11 3',
  home: 'M1.5 5.5L6 1.5l4.5 4V11h-9z M4.8 11V7.8h2.4V11',
  lock: 'M2.5 5.5h7V11h-7z M4 5.5V4a2 2 0 0 1 4 0v1.5',
  chat: 'M1.5 2h9v6.2H5.2L2.8 10.4V8.2H1.5z',
  cart: 'M1 1.5h1.7l1.3 6.3h5.5l1-4.6H3.3 M4.6 10.4h.1 M9 10.4h.1',
};
const ICON_FOR_TYPE = {waiting: 'clock', success: 'check', done: 'check', failure: 'x', error: 'x', decision: 'diamond',
  active: 'pulse', user: 'user', person: 'user', policy: 'lock'};

const ctx2d = document.createElement('canvas').getContext('2d');
function tw(s, size, weight = 400) {
  ctx2d.font = `${weight} ${size}px "JetBrains Mono", ui-monospace, monospace`;
  return ctx2d.measureText(s || '').width;
}
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, s, x, y, cls, anchor = 'middle') {
  const t = el('text', {x, y, class: cls, 'text-anchor': anchor}, parent);
  t.textContent = s;
  return t;
}
const snap = (v, g = 8) => Math.round(v / g) * g;
const overlap = (a, b, m = 0) => a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + b.h + m && b.y < a.y + a.h + m;

function sizeNode(n) {
  n.t = typeOf(n.type);
  const need = Math.max(tw(n.label, 12.5, 700), tw(n.sub || '', 10)) + 40;
  n.w = n.w || Math.max(128, Math.ceil(need / 16) * 16);
  n.h = n.sub ? 56 : 40;
}
function drawNode(layer, n) {
  const g = el('g', {class: `node t-${n.t}`, 'data-id': n.id, transform: `translate(${n.x},${n.y})`}, layer);
  el('rect', {width: n.w, height: n.h, rx: 6, class: 'box'}, g);
  if (n.end) el('rect', {x: 3, y: 3, width: n.w - 6, height: n.h - 6, rx: 4, class: 'box inner'}, g);
  el('path', {d: ICON[n.icon] || ICON[ICON_FOR_TYPE[n.type]] || ICON[n.t], class: 'icon', transform: 'translate(8,7)'}, g);
  txt(g, n.label, n.w / 2, n.sub ? n.h / 2 - 2 : n.h / 2 + 4.5, 'nl');
  if (n.sub) txt(g, n.sub, n.w / 2, n.h / 2 + 14, 'ns');
  el('title', {}, g).textContent = [n.label, n.sub, n.note].filter(Boolean).join(' — ');
  if (tw(n.label, 12.5, 700) > n.w - 12) issues.push(`node "${n.id}": label wider than box`);
}
function markers(defs) {
  // Every marker also exists as "-hot", in the highlight color, swapped in while a relation is focused.
  for (const s of Object.keys(EDGE_NAMES)) for (const hot of ['', '-hot']) {
    const m = el('marker', {id: `m-${s}${hot}`, class: hot ? 'e-hot' : `e-${s}`, viewBox: '0 0 10 10', refX: 9, refY: 5,
      markerWidth: 9, markerHeight: 9, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse'}, defs);
    el('path', {d: 'M0,1 L10,5 L0,9 z', class: 'arrow'}, m);
  }
  // ER cardinality ends (crow's foot). x=20 sits on the table border; the start marker is reversed so the
  // same drawing works at both ends of a relation.

      .sort((a, b) => b.len - a.len);

// ---------- Sequence diagrams ----------
function renderSequence() {

  const idx = Object.fromEntries(P.map((p, i) => [p.id, i]));

    const ok = Object.hasOwn(idx, m.from) && Object.hasOwn(idx, m.to);
    if (!ok) issues.push(`message ${m.from}->${m.to}: unknown participant`);
    return ok;

  const gaps = P.slice(1).map((p, i) => Math.max(P[i].w / 2 + p.w / 2 + 36, 150 * (spec.spacing || 1)));
  for (const m of M) {

    const lo = Math.min(m.a, m.b), hi = Math.max(m.a, m.b);

  el('circle', {cx: 1, cy: 1, r: 1}, pat);
  markers(defs);

    el('rect', {x: PAD - 16, y: g.y0, width: Wpx - 2 * PAD + 32, height: g.y1 - g.y0, rx: 10, class: `band ${g.kind || ''}`}, Lb);
    txt(Lb, g.label, PAD - 4, g.y0 + 14, 'bandl', 'start');
  }

    p.x = xs[i] - p.w / 2; p.y = PAD + headH - p.h; p.cx = xs[i];
    el('line', {x1: xs[i], y1: PAD + headH, x2: xs[i], y2: y - 8, class: 'life'}, Lb);
  });

  // for the reply to a call it made. Consecutive active messages merge into one bar.

    el('rect', {x: xs[i] - 5, y: a[0], width: 10, height: a[1] - a[0], rx: 3, class: 'bar'}, g);
  }));
  const edgeX = (i, y, dir) => xs[i] + (act[i].some(a => y >= a[0] && y <= a[1]) ? 5 * dir : 0);
  M.forEach((m, k) => {
    const g = el('g', {class: `edge e-${m.style}`, 'data-from': m.from, 'data-to': m.to, 'data-k': k}, Le);

    if (m.label) txt(g, m.label, (x1 + x2) / 2, m.y - 7, 'mtext');
  });
  P.forEach(p => drawNode(Ln, p));
  return {types: P.map(p => p.t), styles: M.map(m => m.style)};
}

// Highlight: hovering a line (or its label) lights that relation and the two nodes it joins; hovering an ER

      svg.querySelector(`g.node[data-id="${CSS.escape(e.dataset.to)}"] .rowbg[data-i="${e.dataset.tr}"]`)?.classList.add('hot');

  catch (err) { issues.push('render failed: ' + err.message); console.error(err); }
  legend(used); notes(); focus();
  if (svg.getAttribute('viewBox')) zoomPan();
  const w = document.getElementById('warn');
  if (issues.length) { w.hidden = false; w.textContent = `${issues.length} layout issue${issues.length > 1 ? 's' : ''}`; w.title = issues.join('\n'); }
  window.diagramIssues = issues;
  const rep = document.getElementById('diagram-report');
  window.diagramStats = stats;
  rep.textContent = JSON.stringify({ok: issues.length === 0, issues, ...stats});
  rep.dataset.done = '1';
  console.log('[diagram]', issues.length ? issues : 'ok');
}
main();
</script>
<script id="padawan-extra-js">
/* Padawan: estados, puntitos que viajan, rango y panel de información. Solo lee el spec; no usa la red. */
(function () {
  'use strict';
  var spec = JSON.parse(document.getElementById('spec').textContent);
  var STATE = { backend: 'listo', cloud: 'curso', bus: 'pend' };
  var NAMES = { listo: 'Habilitado', curso: 'En curso', pend: 'Pendiente' };
  var NEXT = {
    n0: 'Respondé las 3 preguntas de contexto: quién sos, para qué querés usar un agente y qué esperás lograr.',
    n1: 'Confirmá que tu agente puede leer y escribir en tu carpeta, y anotá cuál es.',
    n2: 'Creá memoria.md para que tu agente recuerde tus sesiones.',
    n3: 'Armá tu segundo cerebro: primeras notas, etiquetas y, si querés, Obsidian.',
    n4: 'Definí cómo vas a organizar tu trabajo: vocabulario y patrones.',
    n5: 'Escribí tu propia persona: cómo querés que te hable tu agente.',
    n6: 'Explorá lo avanzado (opcional): candado de tareas y versionar con git.'
  };
  var TIPS = [
    'Validá cada paso: abrí el archivo que se creó y comprobá que es lo que esperabas.',
    'Leé cada pedido de permiso antes de aceptar. Al principio van a ser muchos.',
    'Trabajá siempre en la misma carpeta: ahí vive tu memoria.',
    'Al principio nada se automatiza: la confianza se gana de a poco.',
    'Si algo te traba no es un fracaso: anotalo en COMO-PEDIR-AYUDA.md.'
  ];

  function stateOf(id) {
    var n = spec.nodes.filter(function (x) { return x.id === id; })[0];
    return n ? (STATE[n.type] || 'pend') : 'pend';
  }

  function stars() {
    var box = document.createElement('div'); box.id = 'stars';
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('i');
      s.style.left = (rnd() * 100) + '%'; s.style.top = (rnd() * 100) + '%';
      s.style.animationDelay = (rnd() * 4) + 's'; s.style.animationDuration = (3 + rnd() * 4) + 's';
      box.appendChild(s);
    }
    document.body.insertBefore(box, document.body.firstChild);
  }

  function card(title, type, items) {
    var c = document.createElement('div'); c.className = 'card t-' + type;
    var h = document.createElement('h3'); h.textContent = title; c.appendChild(h);
    var ul = document.createElement('ul');
    items.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    c.appendChild(ul); return c;
  }

  function panel() {
    var levels = spec.nodes.filter(function (n) { return /^n\d+$/.test(n.id); });
    var tools = spec.nodes.filter(function (n) { return /^t\d+$/.test(n.id); });
    var done = levels.filter(function (n) { return stateOf(n.id) === 'listo'; });
    var cur = levels.filter(function (n) { return stateOf(n.id) === 'curso'; })[0] ||
              levels.filter(function (n) { return stateOf(n.id) === 'pend'; })[0];
    var total = levels.length, d = done.length;
    var rank = d >= total ? 'Maestro Jedi' : d >= 4 ? 'Caballero Jedi' : 'Padawan';

    var sub = document.getElementById('subtitle');
    sub.hidden = false;
    sub.textContent = 'Que la Fuerza te acompañe · Rango: ' + rank + ' · ' + d + ' de ' + total + ' niveles';
    var bar = document.createElement('div'); bar.id = 'rankbar';
    bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-valuemin', '0');
    bar.setAttribute('aria-valuemax', String(total)); bar.setAttribute('aria-valuenow', String(d));
    var b = document.createElement('b'); b.style.width = Math.round(100 * d / Math.max(total, 1)) + '%';
    bar.appendChild(b); sub.parentNode.appendChild(bar);

    var enabled = tools.filter(function (n) { return stateOf(n.id) === 'listo'; })
      .map(function (n) { return n.label; });
    var prog = [
      'Rango: ' + rank,
      'Niveles completos: ' + d + ' de ' + total,
      cur ? 'Ahora: ' + cur.label + ' · ' + (cur.sub || '') : 'Completaste todos los niveles',
      'Herramientas habilitadas: ' + (enabled.length ? enabled.join(', ') : 'todavía ninguna')
    ];
    var next = cur ? NEXT[cur.id] : '¡Terminaste los 7 niveles! Probá los casos de uso o la pista de Maestría.';
    var notes = document.getElementById('notes');
    notes.textContent = '';
    notes.appendChild(card('Tu progreso', 'backend', prog));
    notes.appendChild(card('Próximo paso', 'cloud', [next]));
    notes.appendChild(card('Consejo del Maestro', 'bus', [TIPS[d % TIPS.length]]));
  }

  function dots() {
    var NS = 'http://www.w3.org/2000/svg';
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var svg = document.getElementById('d'), order = 0;
    svg.querySelectorAll('g.node').forEach(function (g) { g.classList.add('s-' + stateOf(g.dataset.id)); });
    svg.querySelectorAll('g.edge').forEach(function (g) {
      var st = stateOf(g.dataset.to);
      g.classList.add('s-' + st);
      if (st === 'pend' || reduce) return;
      var line = g.querySelector('path.line'); if (!line) return;
      var d = line.getAttribute('d'), dur = Math.max(1.6, line.getTotalLength() / 70);
      for (var k = 0; k < 2; k++) {
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('r', '3.2'); c.setAttribute('class', 'dot dot-' + st);
        var m = document.createElementNS(NS, 'animateMotion');
        m.setAttribute('path', d); m.setAttribute('dur', dur + 's');
        m.setAttribute('begin', (k * dur / 2 + order * 0.35) + 's'); m.setAttribute('repeatCount', 'indefinite');
        c.appendChild(m); g.appendChild(c);
      }
      order++;
    });
  }

  function ready(fn, tries) {
    var rep = document.getElementById('diagram-report');
    if (rep && rep.dataset.done) return fn();
    if ((tries || 0) > 100) return;
    setTimeout(function () { ready(fn, (tries || 0) + 1); }, 100);
  }

  stars();
  ready(function () {
    dots(); panel();
    document.querySelectorAll('#legend *').forEach(function (e) {
      if (!e.children.length && e.textContent.trim() === 'Legend') e.textContent = 'Leyenda';
    });
  });
})();
</script>
